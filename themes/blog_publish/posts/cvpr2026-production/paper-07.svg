<text x="600" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#6b46c1"><tspan x="600" dy="0">vision-language-action model</tspan><tspan x="600" dy="44">geometry-aware control</tspan></text>
