<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">SaPaVe concept diagram</title>
<desc id="desc">Inputs flow through the paper architecture to production capabilities.</desc>
