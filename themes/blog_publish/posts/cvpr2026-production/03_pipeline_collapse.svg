<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">One shared visual model replaces task pipelines</title>
<desc id="desc">Many sensor inputs flow into a shared correspondence and world model which exposes detection, tracking, segmentation, registration, localization, geometry, motion, and forecasting as outputs.</desc>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="50" y="58" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#20242b">The new unit of computer vision is a shared world model</text>
<text x="50" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#6a7079">Tasks become queries over persistent identity, geometry, semantics, and motion.</text>
